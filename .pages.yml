{
  "media": {
    "input": "uploads",
    "output": "/uploads",
    "extensions": [
      "jpg",
      "jpeg",
      "png",
      "webp"
    ],
    "rename": "safe"
  },
  "settings": {
    "content": {
      "merge": true
    }
  },
  "content": [
    {
      "name": "posts",
      "label": "Posts & photos",
      "type": "file",
      "path": "posts.json",
      "format": "json",
      "list": true,
      "fields": [
        {
          "name": "id",
          "type": "uuid",
          "hidden": true
        },
        {
          "name": "title",
          "label": "Title",
          "type": "string",
          "required": true
        },
        {
          "name": "category",
          "label": "Section",
          "type": "select",
          "required": true,
          "default": "personal",
          "options": {
            "values": [
              {
                "name": "personal",
                "label": "Personal"
              },
              {
                "name": "family",
                "label": "Family"
              },
              {
                "name": "friends",
                "label": "Friends"
              },
              {
                "name": "career",
                "label": "Career"
              }
            ]
          }
        },
        {
          "name": "lifeStage",
          "label": "Life stage",
          "description": "Used only for Personal posts. Leave General journal for other sections.",
          "type": "select",
          "options": {
            "values": [
              {
                "name": "",
                "label": "General journal / not applicable"
              },
              {
                "name": "toddler",
                "label": "Toddler"
              },
              {
                "name": "kindergarten",
                "label": "Kindergarten"
              },
              {
                "name": "primary",
                "label": "Primary / Elementary School"
              },
              {
                "name": "high-school",
                "label": "High School"
              },
              {
                "name": "college",
                "label": "College"
              },
              {
                "name": "university",
                "label": "University"
              }
            ]
          }
        },
        {
          "name": "date",
          "label": "Date (optional)",
          "type": "date",
          "required": false,
          "options": {
            "format": "yyyy-MM-dd"
          },
          "default": "",
          "description": "Leave blank if you do not know or do not want to show the date."
        },
        {
          "name": "location",
          "label": "Location",
          "type": "string"
        },
        {
          "name": "caption",
          "label": "Caption / story",
          "type": "text"
        },
        {
          "name": "images",
          "label": "Photos",
          "type": "image",
          "options": {
            "extensions": [
              "jpg",
              "jpeg",
              "png",
              "webp"
            ],
            "rename": "safe",
            "multiple": {
              "max": 6
            },
            "unique": true
          }
        },
        {
          "name": "createdAt",
          "type": "string",
          "hidden": true
        }
      ]
    },
    {
      "name": "home",
      "label": "Home page",
      "type": "file",
      "path": "home-content.json",
      "format": "json",
      "fields": [
        {
          "name": "opacity",
          "label": "Panel opacity (%)",
          "description": "55 matches the current design. Lower numbers make panels more translucent.",
          "type": "number",
          "required": true,
          "options": {
            "min": 15,
            "max": 100
          }
        },
        {
